name: Validar streams M3U

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - "script.py"
      - "build_input_playlist.py"
      - "playlists-urls.txt"
      - ".github/workflows/validar-streams.yml"

permissions:
  contents: write

jobs:
  validar:
    name: Validar playlists
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias para compilar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            git \
            libass-dev \
            libfreetype6-dev \
            libgnutls28-dev \
            libmp3lame-dev \
            libnuma-dev \
            libopus-dev \
            libtheora-dev \
            libvorbis-dev \
            libvpx-dev \
            libx264-dev \
            libx265-dev \
            nasm \
            pkg-config \
            yasm \
            zlib1g-dev

      - name: Restaurar caché de FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-extension-picky
          key: ffmpeg-extension-picky-${{ runner.os }}-git-v2

      - name: Compilar FFmpeg actual
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-source
          cd ffmpeg-source

          ./configure \
            --prefix="${RUNNER_TEMP}/ffmpeg-extension-picky" \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --enable-gpl \
            --enable-gnutls \
            --enable-libass \
            --enable-libfreetype \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libtheora \
            --enable-libvorbis \
            --enable-libvpx \
            --enable-libx264 \
            --enable-libx265 \
            --enable-shared

          make -j"$(nproc)"
          make install

      - name: Usar FFmpeg compilado
        run: |
          echo "${RUNNER_TEMP}/ffmpeg-extension-picky/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${RUNNER_TEMP}/ffmpeg-extension-picky/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Confirmar extension_picky
        run: |
          ffmpeg -version
          ffmpeg -hide_banner -h demuxer=hls 2>&1 | tee ffmpeg-hls-options.txt
          grep -q "extension_picky" ffmpeg-hls-options.txt

      - name: Consolidar playlists remotas
        run: |
          python build_input_playlist.py playlists-urls.txt \
            --output playlists-combinadas.m3u \
            --timeout 45

      - name: Contar streams encontrados
        run: |
          echo "Streams encontrados:"
          grep -ci '^#EXTINF' playlists-combinadas.m3u || true

      - name: Validar streams
        run: |
          python script.py playlists-combinadas.m3u \
            --alive funcionales.m3u \
            --dead descartados.m3u \
            --report reporte.json \
            --concurrency 4 \
            --per-host 1 \
            --timeout 45 \
            --retry-timeout 60 \
            --rw-timeout 20 \
            --analyzeduration 20 \
            --probesize 20000000 \
            --retries 2 \
            --retry-delay 8
            
      - name: Publicar playlist maestra en el repositorio
        if: success() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f funcionales.m3u ]; then
            echo "::error::No se generó funcionales.m3u."
            exit 1
          fi

          cp funcionales.m3u master.m3u

          if git diff --quiet -- master.m3u && git ls-files --error-unmatch master.m3u >/dev/null 2>&1; then
            echo "master.m3u no tiene cambios; no se crea un commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add master.m3u
          git commit -m "chore: actualizar playlist maestra [skip ci]"
          git push origin HEAD:main

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacion-streams-${{ github.run_number }}
          path: |
            playlists-combinadas.m3u
            funcionales.m3u
            descartados.m3u
            reporte.json
            ffmpeg-hls-options.txt
          if-no-files-found: warn
          retention-days: 14